<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>С днём рождения, папа ❤️</title>
     <!-- Favicon -->
  <link rel="apple-touch-icon" sizes="180x180" href="./img/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="./img/icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./img/icons/favicon-16x16.png">
<link rel="manifest" href="/site.webmanifest">
    <!-- AOS CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <!-- Modern normalize CSS -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/modern-normalize/3.0.1/modern-normalize.min.css">
    <!-- Font awesome CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <!-- CSS -->
    <link rel="stylesheet" href="./css/stye.css">
</head>
<body>
    
 <main class="birthday">

        <div class="card">

            <!-- ПЕРВЫЙ ЭКРАН -->
            <section data-aos="zoom-in" class="welcome" id="welcome">

                <div class="cake">
                    <img src="./img/blue-cake2.avif" alt="Праздничный торт">
                </div>

                <h1>Для самого лучшего папы ❤️</h1>

                <button class="open-btn" id="openBtn">
                    Открыть подарок
                </button>

            </section>


            <!-- ФОТОГРАФИИ И ПОЗДРАВЛЕНИЯ -->
            <section class="memories hidden" id="memories">

                <div class="photo-wrapper">
                    <img
                        id="photo"
                        src="./img/icons/ourPhotos/us-1.jpg"
                        alt="Наше воспоминание"
                    >
                </div>

                <p class="message" id="message">
                    С днём рождения, папа! ❤️
                </p>

                <button class="next-btn" id="nextBtn">
                    Следующее ❤️
                </button>

            </section>

        </div>

    </main>


   <!-- AOS JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
        <!-- JS -->
<script src="./js/app.js"></script>


</body>
</html>
